<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Birlikte Çiz</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PeerJS -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body class="bg-slate-900 text-white flex flex-col items-center justify-center h-screen m-0 select-none overflow-hidden">

    <!-- GİRİŞ EKRANI -->
    <div id="menu-screen" class="flex flex-col gap-4 text-center bg-slate-800 p-8 rounded-2xl shadow-xl border border-slate-700 w-80">
        <h1 class="text-3xl font-extrabold text-pink-500">🎨 Ortak Çizim</h1>
        
        <div class="flex flex-col gap-1 text-left">
            <label class="text-xs text-slate-400 font-semibold">Varsayılan Tuval Boyutu:</label>
            <select id="canvas-size-select" class="p-2.5 rounded-xl bg-slate-900 border border-slate-700 text-sm text-white outline-none focus:border-pink-500">
                <option value="400x400">Küçük (400 x 400)</option>
                <option value="600x600" selected>Orta (600 x 600)</option>
                <option value="800x600">Büyük (800 x 600)</option>
            </select>
        </div>

        <button onclick="createRoom()" class="bg-blue-600 hover:bg-blue-500 p-3 rounded-xl font-bold transition shadow-lg mt-2">Oda Kur (Host Ol)</button>
        
        <div class="flex items-center my-1">
            <div class="flex-grow border-t border-slate-700"></div>
            <span class="px-3 text-slate-500 text-xs">YADA</span>
            <div class="flex-grow border-t border-slate-700"></div>
        </div>

        <input type="text" id="room-input" placeholder="Oda Kodunu Buraya Yaz" class="p-3 rounded-xl bg-slate-900 border border-slate-700 text-center text-sm outline-none">
        <button onclick="joinRoom()" class="bg-emerald-600 hover:bg-emerald-500 p-3 rounded-xl font-bold transition shadow-lg">Odaya Katıl</button>
    </div>

    <!-- ODA KURULUNCA ÇIKAN POP-UP -->
    <div id="room-modal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-50">
        <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 w-80 text-center flex flex-col gap-4 shadow-2xl">
            <h2 class="text-xl font-bold text-pink-400">Oda Başarıyla Kuruldu! 🎉</h2>
            <p class="text-xs text-slate-400">Bu oda kodunu arkadaşınla paylaş:</p>
            
            <div class="flex items-center gap-2 bg-slate-900 p-2 rounded-xl border border-slate-700">
                <input type="text" id="room-code-display" readonly class="bg-transparent text-center w-full text-yellow-400 font-mono text-sm outline-none">
                <button onclick="copyCode()" class="bg-pink-600 hover:bg-pink-500 px-3 py-2 rounded-lg text-xs font-bold transition">Kopyala</button>
            </div>
            
            <p id="copy-feedback" class="text-xs text-emerald-400 h-4"></p>
            <button onclick="closeModalToGame()" class="bg-blue-600 hover:bg-blue-500 p-2.5 rounded-xl font-bold text-sm transition">Oyuna Geç</button>
        </div>
    </div>

    <!-- OYUN & ÇİZİM EKRANI -->
    <div id="game-screen" class="hidden flex flex-col items-center gap-2 w-full h-full p-2 overflow-hidden relative">
        <div id="status" class="text-yellow-400 font-semibold text-xs shrink-0">Bağlantı bekleniyor...</div>
        
        <!-- ÜST ARAÇ ÇUBUĞU (Kapatılabilir / Gizlenebilir) -->
        <div id="toolbar" class="bg-slate-800/95 backdrop-blur p-2.5 rounded-2xl border border-slate-700 flex flex-wrap items-center justify-center gap-2 text-sm shadow-xl z-20 shrink-0 transition-all duration-300 max-w-full">
            <div class="flex items-center gap-1.5">
                <label class="text-slate-400 font-bold text-[11px]">Renk:</label>
                <input type="color" id="colorPicker" value="#ec4899" class="w-7 h-7 rounded-lg border-0 bg-transparent cursor-pointer">
            </div>

            <div class="flex items-center gap-1.5">
                <label class="text-slate-400 font-bold text-[11px]">Boyut:</label>
                <input type="range" id="sizePicker" min="1" max="30" value="5" class="w-16 accent-pink-500 cursor-pointer">
                <span id="sizeValue" class="text-pink-400 font-mono w-3 font-bold text-xs">5</span>
            </div>

            <!-- MODLAR -->
            <div class="flex gap-1 bg-slate-900 p-0.5 rounded-xl border border-slate-700 text-xs">
                <button id="btn-pen" onclick="setMode('pen')" class="bg-pink-600 px-2.5 py-1 rounded-lg font-bold transition">Kalem</button>
                <button id="btn-eraser" onclick="setMode('eraser')" class="px-2.5 py-1 rounded-lg font-bold text-slate-400 hover:text-white transition">Silgi</button>
                <button id="btn-pan" onclick="setMode('pan')" class="px-2.5 py-1 rounded-lg font-bold text-slate-400 hover:text-white transition">✋ El</button>
            </div>

            <!-- GERİ AL / İLERİ AL -->
            <div class="flex gap-1 bg-slate-900 p-0.5 rounded-xl border border-slate-700 text-xs">
                <button onclick="undo()" class="px-2 py-1 rounded-lg font-bold bg-slate-800 hover:bg-slate-700 text-slate-300">↩️</button>
                <button onclick="redo()" class="px-2 py-1 rounded-lg font-bold bg-slate-800 hover:bg-slate-700 text-slate-300">↪️</button>
            </div>

            <!-- ZOOM KONTROLLERİ -->
            <div class="flex items-center gap-1 bg-slate-900 p-1 rounded-xl border border-slate-700 text-xs">
                <button onclick="zoomOut()" class="px-2 py-0.5 rounded font-bold bg-slate-800 text-slate-300">-</button>
                <span id="zoom-level" class="text-yellow-400 font-mono px-1 font-bold text-[11px]">100%</span>
                <button onclick="zoomIn()" class="px-2 py-0.5 rounded font-bold bg-slate-800 text-slate-300">+</button>
                <button onclick="resetZoom()" class="px-1.5 py-0.5 rounded text-[10px] bg-slate-800 text-slate-400">Sıfırla</button>
            </div>

            <button onclick="loadDailyTemplate()" class="bg-gradient-to-r from-pink-600 to-purple-600 px-2.5 py-1 rounded-xl font-bold text-white text-xs">✨ Şablon</button>

            <label class="bg-slate-700 hover:bg-slate-600 px-2.5 py-1 rounded-xl font-bold cursor-pointer text-slate-200 text-xs">
                📁 Yükle <input type="file" id="imageLoader" accept="image/*" class="hidden">
            </label>

            <button onclick="removeTemplate()" class="bg-orange-600 px-2 py-1 rounded-xl text-xs font-bold">🗑️ Sil</button>
            <button onclick="clearCanvas(true)" class="bg-red-600 px-2 py-1 rounded-xl text-xs font-bold">Temizle</button>
            <button onclick="downloadCanvas()" class="bg-purple-600 px-2 py-1 rounded-xl text-xs font-bold">📥 İndir</button>
        </div>

        <!-- BARI AÇMA / KAPAMA YÜZEN BUTONU (Telefonda ekranı büyütmek için) -->
        <button onclick="toggleToolbar()" id="toggle-toolbar-btn" class="absolute top-2 right-2 bg-slate-800/90 hover:bg-slate-700 border border-slate-600 px-3 py-1.5 rounded-full text-xs font-bold z-30 shadow-lg transition flex items-center gap-1.5 text-pink-400">
            <span id="toggle-icon">🔼</span> <span id="toggle-text">Barı Gizle</span>
        </button>

        <!-- TUVAL DIŞ ÇERÇEVESİ -->
        <div id="viewport" class="relative w-full flex-grow flex items-center justify-center overflow-hidden bg-slate-950/60 rounded-2xl border border-slate-800 cursor-crosshair touch-none">
            <div class="relative bg-white shadow-2xl transition-transform duration-75" id="canvas-container" style="width: 600px; height: 600px; transform-origin: 0 0;">
                <canvas id="paintCanvas" class="absolute top-0 left-0 touch-none"></canvas>
                <canvas id="templateCanvas" class="absolute top-0 left-0 pointer-events-none" style="mix-blend-mode: multiply;"></canvas>
            </div>
        </div>
        <div class="text-[11px] text-slate-400 shrink-0 pb-1 text-center">💡 Telefonda çift parmakla (pinch) zoom yapabilir, sağ üstten barı gizleyerek alanı genişletebilirsin.</div>
    </div>

    <!-- Harici JavaScript Dosyası -->
    <script src="app.js"></script>
</body>
</html>
